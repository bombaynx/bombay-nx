<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BOMBAY NX</title>

    <meta
        name="description"
        content="BOMBAY NX - Premium Menswear Shop Management System"
    >

    <style>
        body {
            margin: 0;
            background: #f5f1e8;
            color: #202020;
            font-family: Arial, sans-serif;
        }

        .loading {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .box {
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,.10);
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .gold {
            color: #c9a227;
        }

        .loading-text {
            margin-top: 12px;
            color: #666;
        }
    </style>

    <script>
        window.location.replace("owner-login.html");
    </script>
</head>

<body>

    <div class="loading">
        <div class="box">

            <div class="logo">
                BOMBAY <span class="gold">NX</span>
            </div>

            <div class="loading-text">
                Opening Owner Login...
            </div>

        </div>
    </div>

    <noscript>
        <div class="loading">
            <div class="box">
                <div class="logo">
                    BOMBAY <span class="gold">NX</span>
                </div>

                <br>

                <a href="owner-login.html">
                    Open Owner Login
                </a>
            </div>
        </div>
    </noscript>

</body>
</html>
